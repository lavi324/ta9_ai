services:
  wiki_rag_api:
    image: wiki-rag-api:1.3.4
    networks:
      - shared-ai-net
    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_URL: ${OPENAI_URL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      ADO_ORG: ${ADO_ORG}
      ADO_PROJECT: ${ADO_PROJECT}
      ADO_PROJECT_TICKET_SUMMARY: ${ADO_PROJECT_TICKET_SUMMARY}
      ADO_PAT: ${ADO_PAT}
      WIKI_DIR: ${WIKI_DIR}
      CHROMA_DIR: ${CHROMA_DIR}
      SYSTEM_PROMPT_FILE: /app/system_prompt_template.txt
    volumes:
      - /home/ta9/new_apps/wiki_rag/chroma_db:/app/chroma_db
      - /home/ta9/new_apps/wiki_rag/backend/system_prompt_template.txt:/app/system_prompt_template.txt
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  wiki_rag_nginx:
    image: nginx:1.27-alpine
    networks:
      - shared-ai-net
    depends_on:
      - wiki_rag_api
    ports:
      - target: 80
        published: ${UI_PORT}
        protocol: tcp
        mode: host
    volumes:
      - /home/ta9/new_apps/wiki_rag/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ta9/new_apps/wiki_rag/nginx/html:/usr/share/nginx/html:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  shared-ai-net:
    external: true

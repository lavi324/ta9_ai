services:
  wiki_rag_api:
    image: wiki-rag-api:2.2.1
    networks:
      - shared-ai-net
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_URL: ${OPENAI_URL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES}
      PDF_OCR_ENABLED: ${PDF_OCR_ENABLED}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES}
      PDF_TABLE_EXTRACTION_ENABLED: ${PDF_TABLE_EXTRACTION_ENABLED}
      PDF_IMAGE_EXTRACTION_ENABLED: ${PDF_IMAGE_EXTRACTION_ENABLED}
      PDF_MAX_IMAGES_PER_PAGE: ${PDF_MAX_IMAGES_PER_PAGE}
      PDF_MIN_IMAGE_AREA_RATIO: ${PDF_MIN_IMAGE_AREA_RATIO}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS}
      VISION_RETRY_COUNT: ${VISION_RETRY_COUNT}
      DETAILED_INGEST_LOGS: ${DETAILED_INGEST_LOGS}
      MAX_FILE_SIZE_TOKENS: ${MAX_FILE_SIZE_TOKENS}
      BLOCK_PROCESSING_ENABLED: ${BLOCK_PROCESSING_ENABLED}
      ADO_ORG: ${ADO_ORG}
      ADO_PROJECT: ${ADO_PROJECT}
      ADO_PROJECT_TICKET_SUMMARY: ${ADO_PROJECT_TICKET_SUMMARY}
      ADO_PAT: ${ADO_PAT}
      ADO_KEYWORD_TICKET_QUERY_TARGETS: ${ADO_KEYWORD_TICKET_QUERY_TARGETS}
      ADO_KEYWORD_WIQL: ${ADO_KEYWORD_WIQL}
      WIKI_DIR: ${WIKI_DIR}
      CHROMA_DIR: ${CHROMA_DIR}
      SYSTEM_PROMPT_FILE: /app/system_prompt_template.txt
    volumes:
      - /home/ta9/new_apps/wiki_rag/chroma_db:/app/chroma_db
      - /home/ta9/new_apps/wiki_rag/backend/system_prompt_template.txt:/app/system_prompt_template.txt
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  wiki_rag_nginx:
    image: nginx:1.27-alpine
    networks:
      - shared-ai-net
    depends_on:
      - wiki_rag_api
    ports:
      - target: 80
        published: ${UI_PORT}
        protocol: tcp
        mode: host
    volumes:
      - /home/ta9/new_apps/wiki_rag/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ta9/new_apps/wiki_rag/nginx/html:/usr/share/nginx/html:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  shared-ai-net:
    external: true
